[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "veritrace"
version = "0.1.0"
description = "RTL verification hub built on free tooling: causal why-trace and transaction-level analysis over Icarus/Verilator/ModelSim/xsim waveforms."
readme = "README.md"
# §1.8: permissive on purpose. VeriTrace reads RTL as data and links into
# nothing, so nothing it touches can be "contaminated" — and a tool that needs
# legal review before a first run does not get one. LICENSE-GENERATED covers
# the separate question of what `gen-sva` and `stimgen` output carry.
license = "MIT"
license-files = ["LICENSE", "LICENSE-GENERATED"]
# The upper bound is not cosmetic: PyO3 refuses to compile against a CPython
# newer than the version it knows about, and without a ceiling here pip picks
# such an interpreter, starts a source build and fails with a wall of Rust
# output. With it, pip says "requires a different Python" and stops. Raise both
# this and the `pyo3` dependency in crates/vt-py/Cargo.toml together.
requires-python = ">=3.12,<3.15"
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    # `uvicorn` alone has no WebSocket implementation and answers upgrade
    # requests with 404. Starlette's TestClient does not need one, so this gap
    # is invisible to the test suite and only shows up against a real server.
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "msgpack>=1.0",
    # §12's bug report. A template engine rather than string concatenation
    # because the report interleaves user data — signal names, source lines,
    # simulator output — with markup, and Jinja2 escapes it by default. Hand-
    # rolled f-strings would put an unescaped `<` from a `<=` in the RTL into
    # the page and silently break every report that quotes a non-blocking
    # assignment.
    "jinja2>=3.1",
    # §13.6's regression database. A file, not a server — which is the whole
    # reason the spec names DuckDB: `record` and `history` have to work in a
    # repository checkout with nothing running.
    "duckdb>=1.0",
    # SystemVerilog front end. Needed for the *elaborated* AST — generate blocks
    # expanded and parameters resolved — which is what makes correlation
    # tractable (§4.1).
    "pyslang>=7.0",
]

[project.scripts]
veritrace = "veritrace.cli:main"

[tool.maturin]
manifest-path = "crates/vt-py/Cargo.toml"
python-source = "python"
module-name = "veritrace._native"
# Ship the real libfst reader on Linux/macOS.  The dependency and Rust module
# are target-gated, so this same configuration produces an honest VCD-only
# Windows wheel instead of requiring vcpkg or advertising a broken reader.
features = ["extension-module", "fst"]
# Two sets of non-Python files the package cannot work without.
#
# `web/**` is the built frontend, so `pip install veritrace && veritrace serve`
# opens a working interface rather than a bare API. Produced by `make web-build`
# into the package directory; the source tree does not carry it.
#
# `protocol/packs/**` are the shipped protocol packs (§8.14-8.15). Without them
# interface detection silently matches nothing, which looks exactly like a
# design that has no bus — the worst possible failure for this feature.
#
# `packs/timing/*.toml` are §8.20's per-chip SDRAM constraint tables. They need
# their own line because the glob above does not recurse: without it a wheel
# install would detect a memory interface and then refuse to check a single
# timing constraint against it.
#
# `export/templates/*.j2` is §12's bug report. Without it `veritrace export`
# raises TemplateNotFound on an installed wheel while working perfectly from a
# checkout — the failure mode that only ever shows up for other people.
include = [
    { path = "python/veritrace/web/**/*", format = "wheel" },
    { path = "python/veritrace/export/templates/*.j2", format = "wheel" },
    { path = "python/veritrace/protocol/packs/*.toml", format = "wheel" },
    { path = "python/veritrace/protocol/packs/timing/*.toml", format = "wheel" },
]

[dependency-groups]
# §14.2 makes property-based testing part of the plan, not an extra: the
# expression layer is 4-state and the cases nobody thinks of are exactly the
# ones that produce a confidently wrong causal chain.
dev = ["pytest>=8.0", "httpx2>=2.12", "hypothesis>=6.0"]
